[package]
name = "silvermite"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Minimum cost flow solvers (network simplex and cost scaling) ported from LEMON"
license = "BSL-1.0"
keywords = ["network-flow", "min-cost-flow", "network-simplex", "optimization", "graph"]
categories = ["algorithms", "mathematics"]

[features]
petgraph = ["dep:petgraph"]

[dependencies]
itertools = { version = "0.15.0", default-features = false }
nonmax = { version = "0.5.5", default-features = false }
num-traits = { version = "0.2.19", default-features = false, features = ["i128"] }
petgraph = { version = "0.8", optional = true, default-features = false }
thiserror = "2.0.21"

[dev-dependencies]
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }

[profile.release]
debug = 1

[package.metadata.docs.rs]
all-features = true
